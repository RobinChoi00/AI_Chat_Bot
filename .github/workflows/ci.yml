name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate Fonz ingest artifacts
        run: |
          python script/ingest_fonz_warranty.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/fonz_error_codes.json").read_text(encoding="utf-8"))
          count = len(payload.get("entries") or [])
          if count < 100:
              raise SystemExit(f"Expected >=100 Fonz entries after ingest, got {count}")
          print(f"Fonz entries ready: {count}")
          PY
      - name: Run pytest
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Pytest failed (last 120 lines)"
              echo '```text'
              tail -120 pytest-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: ignore
      - run: pip-audit -r requirements-prod.txt
      - run: python script/validate_flowchart.py
      - run: python script/smoke_test_warranty_flow.py
      - run: python script/evaluate_answer_quality.py
      - run: python -m compileall -q app config.py tests script

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: docker build --pull --no-cache -f Dockerfile.backend -t ai-chat-backend:${{ github.sha }} .
      - run: >-
          docker build --pull
          --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid
          -f Dockerfile.frontend
          -t ai-chat-frontend:${{ github.sha }} .
      - name: Scan backend image for remediable high/critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-chat-backend:${{ github.sha }}
          format: table
          output: trivy-backend.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Publish Trivy backend report on failure
        if: failure()
        run: |
          {
            echo "### Trivy backend scan failed"
            echo '```text'
            tail -120 trivy-backend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Scan frontend image for remediable high/critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-chat-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
