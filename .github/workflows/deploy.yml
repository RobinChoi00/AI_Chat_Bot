name: Production Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Deploy tested commit with automatic rollback
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script: |
            set -e
            cd ~/AI_Chat_Bot
            # Execute the tested release's script, not the older host copy.
            # Its own checkout/backup/overlay protection and rollback stay in charge.
            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            deploy_script="$(mktemp)"
            trap 'rm -f "$deploy_script"' EXIT
            git show "${DEPLOY_SHA}:script/deploy.sh" > "$deploy_script"
            DEPLOY_REPOSITORY_ROOT="$PWD" bash "$deploy_script" "$DEPLOY_SHA"
