# Production services
# Backend:  FastAPI on port 8000
# Frontend: Next.js on port 3000
#
# Streamlit services (app.py / admin_dashboard.py) have been ARCHIVED to
# legacy/streamlit/ and are NOT started in production.
# Run them manually for dev/debug: see legacy/streamlit/README.md

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    restart: always
    environment:
      - TZ=America/Chicago
      - PYTHONPATH=/app:/app/app
    env_file:
      - .env
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./db_data:/app/db_data
      - ./uploaded_evidence:/app/uploaded_evidence
      - ./data/warranty_flowchart.json:/app/data/warranty_flowchart.json:ro
      - ./data/warranty_evidence_specs.json:/app/data/warranty_evidence_specs.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Use host DNS/network during build — reduces npm ECONNRESET on small EC2
      network: host
      args:
        # Public URL baked into client-side JS bundle at build time.
        # Server-side Route Handlers use BACKEND_INTERNAL_URL (Docker network).
        NEXT_PUBLIC_API_BASE_URL: https://api.osakichair.com
    ports:
      - "3000:3000"
    restart: always
    environment:
      - TZ=America/Chicago
      - NEXT_PUBLIC_API_BASE_URL=https://api.osakichair.com
      - BACKEND_INTERNAL_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai_network

  # ---------------------------------------------------------------------------
  # LEGACY — Streamlit services (archived, not started by default)
