# Production services
# Backend:  FastAPI on port 8000
# Frontend: Next.js on port 3000
#
# Streamlit services (app.py / admin_dashboard.py) have been ARCHIVED to
# legacy/streamlit/ and are NOT started in production.
# Run them manually for dev/debug: see legacy/streamlit/README.md

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    environment:
      - TZ=America/Chicago
      - PYTHONPATH=/app:/app/app
      - APP_ENV=production
    env_file:
      - .env
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./db_data:/app/db_data
      - ./uploaded_evidence:/app/uploaded_evidence
      - ./data:/app/data
      - ./raw_data:/app/raw_data:ro
      - ./rc_audio_cache:/app/rc_audio_cache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - ai_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Use host DNS/network during build — reduces npm ECONNRESET on small EC2
      network: host
      args:
        # Public URL baked into client-side JS bundle at build time.
        # Server-side Route Handlers use BACKEND_INTERNAL_URL (Docker network).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    environment:
      - TZ=America/Chicago
      # Next standalone otherwise binds the container IP only; healthchecks use 127.0.0.1.
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
      - BACKEND_INTERNAL_URL=http://backend:8000
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - ai_network

